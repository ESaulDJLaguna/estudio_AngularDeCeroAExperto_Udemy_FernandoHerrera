<div class="join flex justify-center items-center">
  @for (page of getPagesList(); track page) {
  <!--! Agregar el arreglo vacío en el [routerLink] es como decir "navega a la misma página donde me encuentro" -->
  <button class="join-item btn" [class.btn-primary]="page === activePage()" [routerLink]="[]"
    [queryParams]="{page: page}" (click)="activePage.set(page)">{{page}}</button>
  }
</div>
